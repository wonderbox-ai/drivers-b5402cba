name: Build Wonder Apps APK

on:
  workflow_dispatch:
  push:
    branches: [ "plano-magic-build" ]
    paths:
      - ".build-request"

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep the source of APK availability unambiguous without flooding test
    # contributors with failure-notification emails for transient SDK outages.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build, lint and execute unit tests
        id: validation
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug lintDebug testDebugUnitTest > build.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Build/lint/unit-test exit code: $CODE" >> build.log
          if [ "$CODE" -eq 0 ]; then
            echo "✅ APK validée par Gradle, lint et tests unitaires." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⛔ APK non distribuée : compilation, lint ou tests unitaires en échec. Lire WonderApps-build-log." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: SHA-256 (validated APK only)
        if: ${{ steps.validation.outputs.exit_code == '0' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload validated APK
        if: ${{ steps.validation.outputs.exit_code == '0' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WonderApps-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          retention-days: 2

      - name: Keep build log as artifact
        if: ${{ always() && hashFiles('build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WonderApps-build-log
          path: build.log
          retention-days: 2
