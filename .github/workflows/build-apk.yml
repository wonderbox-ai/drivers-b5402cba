name: Build Wonder Apps APK

on:
  workflow_dispatch:
  push:
    branches: [ "plano-magic-build" ]
    paths:
      - ".build-request"

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Java 17
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        continue-on-error: true
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER" || exit 0
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Gradle 8.9
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK quietly
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug lintDebug testDebugUnitTest > build.log 2>&1
          EXIT_CODE=$?
          echo "Build exit code: $EXIT_CODE" >> build.log
          exit 0

      - name: SHA-256
        continue-on-error: true
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
          fi

      - name: Upload APK if available
        continue-on-error: true
        if: ${{ hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WonderApps-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          retention-days: 1

      - name: Keep build log as artifact
        continue-on-error: true
        if: ${{ hashFiles('build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WonderApps-build-log
          path: build.log
          retention-days: 1
